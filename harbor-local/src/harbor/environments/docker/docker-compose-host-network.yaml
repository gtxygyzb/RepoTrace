# EvoCodeBench local patch (2026-08-10): force host networking for the main
# service. Required on this server because the corporate HTTP proxy MITMs TLS
# from docker bridge subnets (only whitelisted domains pass), while the host
# source IP gets real certificates. With host networking, containers share the
# host's DNS (systemd-resolved) and proxy identity, so apt/pip/curl and the
# model API all behave exactly as on the host.
services:
  main:
    network_mode: host
